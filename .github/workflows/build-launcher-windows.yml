name: Build launcher (Windows)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "launcher/**"
      - ".github/workflows/build-launcher-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build SOVIX Launcher.exe
        run: >
          python -m PyInstaller --noconfirm --onedir --windowed
          --name "SOVIX Launcher"
          --add-data "content.json;."
          --add-data "demo_game.py;."
          launcher.py

      - name: Smoke test (exe starts and stays up)
        shell: pwsh
        run: |
          $exe = "dist\SOVIX Launcher\SOVIX Launcher.exe"
          if (-not (Test-Path $exe)) { throw "exe not found" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "launcher exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: SOVIX-Launcher-windows
          path: launcher/dist/SOVIX Launcher/
          if-no-files-found: error
